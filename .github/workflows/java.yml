name: Java verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile with all warnings treated as errors
        run: javac -encoding UTF-8 -Xlint:all -Werror -d out src/library/*.java test/library/*.java
      - name: Run regression tests
        run: java -cp out library.LibraryFacadeTest
      - name: Run client demonstration
        run: java -cp out library.Main
